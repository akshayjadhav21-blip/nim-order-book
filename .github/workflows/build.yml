# Builds the Android APK and the office web app, and publishes both on GitHub Pages:
#   https://<your-github-name>.github.io/<repo>/              → office desktop app
#   https://<your-github-name>.github.io/<repo>/download.html → APK download page for employees
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "1.0.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download libraries
        run: bash fetch-vendor.sh

      - name: Build web files
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node build.mjs

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' $M
          grep -q "android.permission.CAMERA" $M
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" $G
          grep -E "versionCode|versionName" $G

      - name: App icon
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#13202c' --splashBackgroundColor '#13202c'

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > nim.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::KEYSTORE_B64 secret is missing – using a temporary key. Phones will have to uninstall the old app before each update."
            PASS=temporary123
            keytool -genkeypair -keystore nim.jks -alias nim -keyalg RSA -keysize 2048 -validity 10000 -storepass $PASS -keypass $PASS -dname "CN=New India Motors, O=New India Motors, L=Kolhapur, C=IN"
          fi
          $BT/zipalign -p -f 4 $IN aligned.apk
          $BT/apksigner sign --ks nim.jks --ks-key-alias nim --ks-pass pass:$PASS --key-pass pass:$PASS --out dist/web/NIM-OrderBook.apk aligned.apk
          $BT/apksigner verify dist/web/NIM-OrderBook.apk
          rm -f nim.jks
          ls -la dist/web

      - uses: actions/upload-artifact@v4
        with:
          name: NIM-OrderBook-${{ env.APP_VERSION }}
          path: dist/web/NIM-OrderBook.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
